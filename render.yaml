services:
  - type: web
    name: ai-study-assistant
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gemini-3-flash-preview
      - key: APP_ENV
        value: production
